[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera-agent-baseline"
version = "0.2.0"
description = "CHIMERA Task-1 agent: fixed orchestration over subtask models + Gemma 4 E2B reasoning (Ollama)"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=0.3,<0.4",
  "langchain-ollama>=0.2",
  "mcp>=1.9,<2",
  "omegaconf>=2.3",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]
