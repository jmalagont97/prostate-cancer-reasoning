# ==============================================================================
# CHIMERA Task-1 Agent (minimized baseline) — config.
#
# Fixed-orchestration pipeline: Tool A -> B -> C -> form_fill (single LLM call).
# LLM: Gemma 4 E2B via Ollama (invariant).
# ==============================================================================

defaults:
  - _self_

paths:
  data_root: data
  output_dir: test/output
  # Directory holding subtask1_ensemble.pkl / subtask2_kdm.pkl / subtask3_extratrees.pkl
  submodels_dir: ../../training/models

model:
  provider: ollama
  base_url: http://127.0.0.1:11434   # Ollama served INSIDE the same container
  model_id: gemma3n:e2b              # Gemma 4 E2B — invariant
  request_timeout: 600

mcp:
  # Launched as a stdio subprocess by the runner.
  server_module: chimera_agent_baseline.mcp_server

agent:
  tasks: [1]
  pids: null
  limit: null
  form_fill:
    max_retries: 3

generation:
  temperature: 0.2          # low: transcription/synthesis task, not exploration
  num_ctx: 16384            # Ollama context window
  num_predict: 2048

logging:
  level: INFO

hydra:
  run:
    dir: .
  job:
    chdir: false
