[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embedkit"
version = "0.1.1"
description = "A Python library for analyzing and improving ML embedding spaces"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EmbedKit Contributors" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scikit-dimension>=0.3",
    "torch>=2.1",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "umap-learn>=0.5",
    "faiss-cpu>=1.7",
]

[project.optional-dependencies]
dev      = ["pytest>=8", "pytest-cov", "ruff", "mypy"]
examples = ["torchvision>=0.16"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
